name: Electio smoke checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: find . -path ./node_modules -prune -o \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check Python pipeline syntax and territorial joins
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/smoke_reference_resolution.py
      - run: npm run test:selectors
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/electio-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/electio-http.log
          exit 1
      - run: npm run test:browser
        env:
          BASE_URL: http://127.0.0.1:4173/
      - run: npm run test:public
        env:
          BASE_URL: http://127.0.0.1:4173/
