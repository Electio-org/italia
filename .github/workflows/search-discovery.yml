name: Notify search engines after publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: search-discovery
  cancel-in-progress: true
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for this Pages revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")
            if [ "$(printf '%s' "$result" | jq -r .commit)" = "$GITHUB_SHA" ] && [ "$(printf '%s' "$result" | jq -r .status)" = built ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Pages has not published this revision; no stale URLs were submitted."
          exit 1
      - name: Notify participating search engines
        run: python scripts/notify_search.py
